# Uma instância do nó por IMU. Números reais precisam de ponto decimal (1.0, não 1).
#
# axes: eixos do corpo (x frente, y esquerda, z cima) em função dos eixos do
# sensor, ex. ["-y", "x", "z"]. Confira parado: roll/pitch ~ 0; inclinando
# para frente, pitch > 0; tombando para a direita, roll > 0.

# IMU da cabeça (linhas "IMU", MPU 0x68 -> EDROM_IMU_UDP do edrom_buttond.py)
imu_head:
  ros__parameters:
    role: "head"
    udp_port: 5600
    axes: ["x", "y", "z"]          # com a cabeça reta (pan = tilt = 0)
    stamp_offset_ms: 0.0           # atraso da IMU em relação à câmera (ms)
    joint_states_topic: "/joint_states_feedback"
    pan_joint: "head_pan"
    # Cadeia da câmera (camera_model.py). VALORES APROXIMADOS: meça no robô.
    camera:
      neck: [0.0, 0.0, 0.50]       # cruzamento dos eixos pan/tilt em base_footprint (m)
      camera_offset: [0.03, 0.0, 0.05]
      camera_mount_rpy: [3.14159265, 0.0, 0.0]   # câmera de cabeça para baixo
      pan_sign: 1.0
      pan_offset: 0.0

# IMU do tronco (linhas "IMU2", MPU 0x69 -> EDROM_IMU2_UDP)
imu_torso:
  ros__parameters:
    role: "torso"
    udp_port: 5601
    axes: ["x", "y", "z"]          # com o robô em pé
    # controlador de torso do aurea_walk (configs/torso_controller.yaml)
    rpy_topic: "/imu/ekf/rpy"      # Vector3Stamped, graus (x roll, y pitch)
    imu_topic: "/imu/data_raw"     # sensor_msgs/Imu, giro em rad/s
