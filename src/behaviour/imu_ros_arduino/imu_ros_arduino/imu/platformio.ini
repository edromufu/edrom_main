; Firmware da IMU (MPU-6050) -> serial -> imu_read.py
;
; Compilar:   pio run -e <ambiente>
; Gravar:     pio run -e <ambiente> -t upload
; Monitor:    pio device monitor -e <ambiente>
;
; Sem -e, "pio run" usa default_envs.
;
; Variantes por placa:
;   <placa>          filtro complementar no campo roll (padrão, formato do imu_read.py)
;   <placa>_ekf      EKF no campo roll (mesmo formato, pode ir direto para o ROS)
;   <placa>_mahony   Mahony no campo roll (mesmo formato, pode ir direto para o ROS)
;   <placa>_compare  CSV com Mahony e EKF lado a lado (colunas em src/main.cpp).
;                    O monitor salva em platformio-device-monitor-*.log nesta
;                    pasta. Não é lido pelo ROS.
;
; Ajuste dos filtros (ver src/ekf.h e src/mahony.h), por exemplo:
;   build_flags = ${env.build_flags} -D EKF_ACCEL_NOISE=0.08f -D MAHONY_KP=1.5f

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
build_flags =


; ---------------- ESP32 DevKit (SDA = GPIO21, SCL = GPIO22) ----------------
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600
; Decodifica o backtrace em caso de crash (Guru Meditation)
monitor_filters = esp32_exception_decoder

[env:esp32dev_ekf]
extends = env:esp32dev
build_flags = ${env.build_flags} -D IMU_FILTER=1

[env:esp32dev_mahony]
extends = env:esp32dev
build_flags = ${env.build_flags} -D IMU_FILTER=2

[env:esp32dev_compare]
extends = env:esp32dev
build_flags = ${env.build_flags} -D IMU_OUTPUT_COMPARE
monitor_filters = esp32_exception_decoder, log2file
