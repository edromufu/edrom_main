direct_controller:
  ros__parameters:
    # --- Configurações da Porta Serial ---
    usb_port: "/dev/ttyUSB1"
    baud_rate: 1000000

    # --- Lista com os nomes das juntas que este nó controlará ---
    joint_names: [
      "head_pan", "head_tilt",
      "l_sho_pitch", "l_sho_roll", "l_el", 
      "r_sho_pitch", "r_sho_roll", "r_el", 
      "r_hip_yaw", "r_hip_roll", "r_hip_pitch", "r_knee", "r_ank_pitch", "r_ank_roll",
      "l_hip_yaw", "l_hip_roll", "l_hip_pitch", "l_knee", "l_ank_pitch", "l_ank_roll"
    ]

    # --- Parâmetros individuais para cada junta ---
    # protocol: 1.0 para AX, 2.0 para MX
    head_pan:
      id: 1
      protocol: 1.0
      inverted: false
    head_tilt:
      id: 2
      protocol: 1.0
      inverted: false


    l_sho_pitch:    {id: 7, protocol: 2.0, inverted: false, calibration_offset: 0.0}
    l_sho_roll:   {id: 5, protocol: 2.0, inverted: true, calibration_offset: 0.0}
    l_el:  {id: 3, protocol: 2.0, inverted: false, calibration_offset: 0.0}

    r_sho_pitch:    {id: 8, protocol: 2.0, inverted: true, calibration_offset: 0.0}
    r_sho_roll:   {id: 6, protocol: 2.0, inverted: true, calibration_offset: 0.0}
    r_el:  {id: 4, protocol: 2.0, inverted: false, calibration_offset: 0.0}


    r_hip_yaw:    {id: 10, protocol: 2.0, inverted: false, calibration_offset: -0.0}
    r_hip_roll:   {id: 12, protocol: 2.0, inverted: true, calibration_offset: 0.0}
    r_hip_pitch:  {id: 14, protocol: 2.0, inverted: false, calibration_offset: 0.0} #03
    r_knee:       {id: 16, protocol: 2.0, inverted: true, calibration_offset: -0.0} #- 05
    r_ank_pitch:  {id: 18, protocol: 2.0, inverted: true,  calibration_offset: 0.0}
    r_ank_roll:   {id: 20, protocol: 2.0, inverted: false, calibration_offset: 0.0}

    l_hip_yaw:    {id: 9, protocol: 2.0, inverted: false, calibration_offset: 0.0}
    l_hip_roll:   {id: 11, protocol: 2.0, inverted: true, calibration_offset: -0.0}
    l_hip_pitch:  {id: 13, protocol: 2.0, inverted: true, calibration_offset: 0.04}
    l_knee:       {id: 15, protocol: 2.0, inverted: false, calibration_offset: 0.0}
    l_ank_pitch:  {id: 17, protocol: 2.0, inverted: true, calibration_offset: 0.0}
    l_ank_roll:   {id: 19, protocol: 2.0, inverted: false, calibration_offset: -0.0}
