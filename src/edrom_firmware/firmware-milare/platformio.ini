[env:esp32dev]
build_src_filter = +<*>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; micro-ROS
board_microros_distro = humble       ; troque para jazzy se usar Jazzy
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; Teste de placa: só imprime os botões no Serial (sem micro-ROS)
[env:test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_test/button_test.cpp>
