[env:esp32dev]
build_src_filter = +<*>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 460800   ; igual a SERIAL_BAUD em src/main.cpp

; Protocolo serial em texto (sem micro-ROS): o PC lê com host/edrom_buttond.py

; Teste de placa: só imprime os botões no Serial (sem micro-ROS)
[env:test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_test/button_test.cpp>

; Diagnóstico do I2C das IMUs: scan + leitura de 0x68/0x69 em 100 e 400 kHz
[env:i2cscan]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_test/i2c_scan.cpp>
